workflows:
  android-workflow:
    name: Build Catet Duit Dewe APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Setup Android & Restore Manifest
        script: |
          mv android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
