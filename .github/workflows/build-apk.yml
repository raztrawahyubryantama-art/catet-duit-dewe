yaml

name: Build Catet Duit Dewe APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Generate Android Folder
        run: |
          mv android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: catet-duit-dewe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
